
    
  
name: Build and publish Calendar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
concurrency:
  group: calendar-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.CALENDAR_KEYSTORE }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo 'Set CALENDAR_KEYSTORE repository secret first.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEY_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - run: gradle :app:assembleDebug
        env:
          CALENDAR_VERSION: ${{ github.run_number }}
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk calendar.apk
          gh release create "v${GITHUB_RUN_NUMBER}" calendar.apk --title "Календарь ${GITHUB_RUN_NUMBER}" --notes "Android APK" --latest || gh release upload "v${GITHUB_RUN_NUMBER}" calendar.apk --clobber

